[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
acp-core = { path = "crates/acp-core" }
agent-client-protocol = { version = "3.4", features = ["process"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
