[package]
name = "acp-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The tokens each turn took come in the prompt's answer, which ACP 3.4 still marks unstable.
# Codex's adapter sends it, and has no other count of what a session used.
agent-client-protocol = { workspace = true, features = ["unstable_end_turn_token_usage"] }
chrono.workspace = true
futures.workspace = true
# Lets a front end keep settings between runs.
serde.workspace = true
smol.workspace = true
# How long the agent takes to answer each request, for a front end that listens.
tracing = "0.1"
