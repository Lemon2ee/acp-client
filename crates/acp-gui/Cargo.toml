[package]
name = "acp-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# For finding slow frames and slow agents: `cargo run --release -p acp-gui --features profile`.
# Cmd+Option+F cycles gpui's frame-time overlay; the agent's answer times go to stderr;
# and both, with gpui's own frame zones, go to Tracy once it connects.
profile = [
    "gpui-kit/profiler",
    "dep:profiling",
    "dep:tracing-subscriber",
    "dep:tracing-tracy",
]

[dependencies]
acp-core.workspace = true
chrono = { workspace = true, features = ["clock"] }
# Finds the folder for the app's own files, such as the models added to the model list.
dirs = "6"
# Pins a gpui-pre snapshot of Zed's gpui and re-exports it with gpui-component.
# (crates.io `gpui` itself stopped at 0.2.2 in 2025-10.)
gpui-kit = "0.8"
# Watches a session's folder during its turns for the files the info panel lists: FSEvents
# on macOS. gpui-component already builds it at this version.
notify = "8.2"
# Keeps each agent's last settings, the sessions to load again, and the settings page's
# settings between runs.
serde.workspace = true
serde_json.workspace = true
# Works out the lines an agent's edit changes, from the whole file before and after that
# ACP sends. gpui-component already builds it at this version.
similar = "2.7"
# Hands the system-wide shortcut's presses from Carbon's callback to the window.
smol.workspace = true

# Only for `profile`. Not used here directly: turning on Tracy in `profiling` makes the
# zones gpui already marks (each window draw, present and input dispatch, and a frame
# mark per present) show up in Tracy.
profiling = { version = "1", features = ["profile-with-tracy"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "fmt",
    "std",
], optional = true }
# 0.11 links the same tracy-client (0.18) as `profiling`, and only one copy can be linked.
# The Tracy viewer must be the version the locked tracy-client-sys builds: 0.14 for 0.29.
# `ondemand` records only while Tracy is connected, so a long run without it holds no
# data; `only-localhost` keeps other machines on the network from connecting.
tracing-tracy = { version = "0.11", features = [
    "ondemand",
    "only-localhost",
], optional = true }

# Reads the traffic lights' size and spacing from AppKit, shows the hidden app and the
# minimized window for the system-wide shortcut, and opens the folder panel at the
# session's folder, which gpui's own `prompt_for_paths` can't. gpui's macOS layer already
# builds these crates at these versions, with these features but NSSound and
# NSUserDefaults, which play the effort meter's sounds and read the system's scrolling
# and sound settings.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSSound",
    "NSView",
    "NSWindow",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDateFormatter",
    "NSFormatter",
    "NSLocale",
    "NSString",
    "NSURL",
    "NSUserDefaults",
] }
raw-window-handle = "0.6"
